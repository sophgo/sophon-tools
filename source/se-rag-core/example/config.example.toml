# ⚠️ 本文件是历史参考，**不会被 se-rag-core 加载**。
#
# TOML 配置支持从未实现——历史上这里只是"预留"的示意，README 曾据此宣传不存在的
# 配置能力。真正的配置入口是 JSON：
#
#   /etc/se-rag-core/config.json      （默认路径）
#   SE_RAG_CONFIG=<path>              （指定替代路径）
#
# 可用的完整示例见同目录的 config.example.json；字段契约见 README 的「供应商配置」。
# 下面保留原 TOML 形态仅用于对照旧文档，修改它不会产生任何效果。

# [embedder]
# type     = "siliconflow"     # siliconflow | sophnet
# model    = "BAAI/bge-m3"
# base_url = "https://api.siliconflow.cn/v1"
# dim      = 1024
# # api_key 留空 → 用内置 key（触发限流：并发≤1、单次≤2段落）；填写 → 用户自备 key，放开限流
# api_key = ""
#
# [reranker]
# type     = "siliconflow"
# model    = "BAAI/bge-reranker-v2-m3"
# base_url = "https://api.siliconflow.cn/v1"
# api_key = ""

# 多知识库：不同库用不同 -index-dir / --docs-dir，无需 product 维度。
# 示例：build --docs-dir docs/se8 -index-dir ./rag-se8
