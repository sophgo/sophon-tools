server:
  port: 8080
  # 本地 admin 占位记录的 MD5 口令。明文口令不随仓库提交（MYS-382）：
  # 部署期通过环境变量 SOPHLITEOS_ADMIN_PASSWORD 注入（systemd 环境变量/EnvironmentFile），
  # 或经外部覆盖本配置文件（server.admin-password）。缺省时以空口令占位——
  # 登录实际走 /api/v1/login 反代到 bmssm 鉴权，此记录无在线登录入口。
  # admin-password: <部署期注入>
  # 常规 HTTP 读/写超时（非 OTA 升级接口）：慢连接不会长期占用连接。
  read-timeout: 30s
  # 读取请求头超时：拒绝"慢速请求头"式慢连接攻击（slowloris）。
  read-header-timeout: 10s
  # OTA/升级长超时（分片上传、固件升级需更长窗口；旧配置键 server.timeout 自动兼容）。
  ota-timeout: 12m

log:
  path: /var/log/sophliteos
  level: INFO

db:
  path: /var/lib/sophliteos/db/sophliteos.db
  save-days: 90

# bmssm 反代目标。登录/鉴权全部由 bmssm 处理，sophliteos 不保存其凭据；
# 部署时请确认 bmssm 侧口令强度。
# authSecret：本地敏感路由（OTA/升级/metrics/version）校验 bmssm JWT 时使用的签名密钥。
#   留空（推荐）：读取 bmssm 持久化随机 secret（/var/lib/bmssm/jwt_secret，默认部署一致）；
#   仅当 bmssm 显式配置了 server.authSecret 时，此处才需配置相同值，否则两者不一致会导致
#   /api/v1 登录成功后 /api/sso/register 校验失败（前端提示"建立会话失败"）。
bmssm:
  server: '127.0.0.1:9779'
  authSecret: ''
